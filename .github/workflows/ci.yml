name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[transform,dev]"

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Tests
        run: pytest

      - name: Build CI fixtures
        run: python tests/build_ci_fixtures.py

      - name: dbt
        working-directory: transform
        run: |
          dbt deps
          dbt build --target ci --vars '{staging_dir: staging-ci}'